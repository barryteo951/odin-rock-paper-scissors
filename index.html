<!DOCTYPE html>


<html lang="en">

    <head>
        <title>Rock, Paper, Scissors</title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 25px;
                justify-content: center;
                min-height: 100vh;
            }

            .labels {
                display: flex;
                text-align: center;
                font-size: 60px;
            }
            
            .labels .hyphen {
                margin-left: 30px;
                margin-right: 30px;
            }

            .labels .bot {
                text-align: left;
                width: 130px;
            }

            .scores {
                display: flex;
                justify-content: center;
                font-size: 60px;
            }

            .scores label {
                margin-left: 60px;             
                margin-right: 60px;   
            }

            /* .images {
                margin-top: 60px;
                display: flex;
            } */

            .buttons {
                margin-top: 125px;
                display: flex;
                gap: 50px;
                margin-bottom: 125px;
            }

            button {
                display: flex;
                justify-content: center;
                width: 200px;
                padding: 100px 100px;
                border-radius: 50px;
            }

            .message {
                font-size: 60px;
            }
        </style>
    </head>



    <body>
        <div class="labels">
            <label class="you">YOU</label>
            <label class="hyphen">-</label>
            <label class="bot">BOT</label>
        </div>

        <div class="scores">
            <div class="human">0</div>
            <label class="hyphen">-</label>
            <div class="computer">0</div>
        </div>

        <div class="buttons">
            <button class="rock">
                <img src="./images/rock.png" width="500px"></img>
            </button>
            <button class="paper">
                <img src="./images/paper.png" width="500px"></img>
            </button>
            <button class="scissors">
                <img src="./images/scissors.png" width="500px"></img>
            </button>
        </div>

        <div class="message">First to 5 points wins!</div>
        


        <script src="script.js"></script>
    </body>

</html>
